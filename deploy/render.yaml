databases:
  - name: supplychain-postgres
    databaseName: supplychain_autopilot
    user: supplychain
    region: oregon
    plan: free
    ipAllowList: []

services:
  # 1. CrewAI A2A Service
  - type: web
    name: supplychain-crewai-service
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -e packages/contracts && pip install -r requirements.txt
    startCommand: uvicorn services.crewai_service.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: supplychain-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 2. FastAPI Backend & ADK Orchestrator
  - type: web
    name: supplychain-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -e packages/contracts && pip install -r requirements.txt
    startCommand: python data/seed/seed_data.py && uvicorn services.backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: supplychain-postgres
          property: connectionString
      - key: CREWAI_A2A_URL
        fromService:
          name: supplychain-crewai-service
          type: web
          property: host
      - key: GEMINI_API_KEY
        sync: false

  # 3. React 18 Frontend Management Dashboard
  - type: web
    name: supplychain-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: supplychain-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
